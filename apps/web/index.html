<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Find House</title>
    <script>
      try {
        var t = localStorage.getItem('findhouse_theme')
        if (t && t !== 'navy' && /^[a-z]+$/.test(t)) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- Open the connections the page is about to need while the scripts are still downloading. The font is served from
         this site (src/assets/fonts), so there is no third-party font request at all. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
    <link rel="preconnect" href="%VITE_R2_PUBLIC_URL%">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
